name: Publish Windows installer
on:
  # Пуш тега v1.2.3 запускает сборку и публикацию автоматически.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-windows
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Prepare version and prevent replacing a published installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Version already published. Increase package.json and package-lock.json versions first.' }
          $global:LASTEXITCODE = 0
      - run: node scripts/package.mjs --versioned
      - name: Prepare portable Inno Setup compiler
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tools/inno-portable | Out-Null
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/tools.innosetup/6.7.3/tools.innosetup.6.7.3.nupkg' -OutFile .tools/inno.zip
          Expand-Archive .tools/inno.zip .tools/inno-portable
          $signature = Get-AuthenticodeSignature .tools/inno-portable/tools/ISCC.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Pyrsys B.V.') { throw 'Compiler signature verification failed' }
      - run: node scripts/build-installer.mjs
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "release/Nocturne-Setup-$env:RELEASE_VERSION-x64.exe"
          $notesPath = "docs/releases/$env:RELEASE_VERSION.md"
          $noteArgs = if (Test-Path $notesPath) { @('--notes-file', $notesPath) } else { @('--notes', 'Установщик Nocturne для Windows x64. Профили сохраняются при обновлении. Установщик пока без подписи издателя. SHA-256 опубликован рядом с файлом.') }
          gh release create "v$env:RELEASE_VERSION" $installer "$installer.sha256" --target $env:GITHUB_SHA --title "Nocturne $env:RELEASE_VERSION — Windows x64" @noteArgs --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
